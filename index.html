<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuuta's Tools — 互動工具集</title><meta name="description" content="悠太翼的互動工具與小實驗。"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><script src="assets/theme.js"></script><style>.hero{padding:64px 0 24px}.hero p{font-size:19px;color:var(--ink-soft);max-width:640px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:32px 0 16px}.search{width:100%;max-width:420px;padding:9px 13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:15px}.tools{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}.tools li{border-bottom:1px solid var(--line)}.tools li[hidden],#empty[hidden]{display:none}.tools a{display:grid;grid-template-columns:88px 1fr auto;gap:4px 20px;align-items:baseline;padding:22px 4px;color:var(--ink);text-decoration:none}.tools a:hover .title{color:var(--wire)}.id{font-family:"JetBrains Mono",monospace;color:var(--ink-soft);font-size:15px}.title{font-size:21px;font-weight:700}.category{font-size:14px;color:var(--ink-soft)}.desc{grid-column:2/4;color:var(--ink-soft);font-size:15px}#empty{color:var(--ink-soft)}@media(max-width:600px){.tools a{grid-template-columns:1fr}.desc{grid-column:auto}.hero{padding-top:42px}}</style></head><body><header class="site-bar"><div class="wrap"><a class="home" href="./">Yuuta's Tools</a><button class="theme-btn" type="button">切換主題</button></div></header><main class="wrap"><section class="hero"><h1>Yuuta's Tools</h1><p>一些突發奇想的互動實驗與小工具。打開瀏覽器，就能直接動手玩。0w0</p></section><div class="filters" role="group" aria-label="工具分類"><button class="btn" data-filter="all" aria-pressed="true">全部</button><button class="btn" data-filter="geometry" aria-pressed="false">幾何實驗</button><button class="btn" data-filter="drawing" aria-pressed="false">繪圖</button></div><input class="search" id="search" type="search" placeholder="搜尋工具名稱或介紹…" aria-label="搜尋工具"><ul class="tools"><li data-tags="geometry drawing"><a href="three-pins-circle/"><span class="id">0001</span><span class="title">三釘繞線畫圓</span><span class="category">幾何實驗 · 繪圖</span><span class="desc">自己釘下三顆釘子，調整繩長，親手拖動筆尖探索曲線。支援畫布縮放與平移。</span></a></li></ul><p id="empty" hidden>找不到符合的工具。</p></main><footer class="site-foot"><div class="wrap">想新增工具？在 <a href="https://github.com/YuutaTsubasa/tools">YuutaTsubasa/tools</a> 新增資料夾，並在目錄頁加入一列。</div></footer><script>(()=>{const bs=[...document.querySelectorAll("[data-filter]")],items=[...document.querySelectorAll(".tools li")],search=document.querySelector("#search"),empty=document.querySelector("#empty");let f="all";function apply(){let count=0;for(const li of items){li.hidden=!(f==="all"||li.dataset.tags.split(" ").includes(f))||!li.textContent.toLowerCase().includes(search.value.trim().toLowerCase());if(!li.hidden)count++}empty.hidden=count!==0}bs.forEach(b=>b.onclick=()=>{f=b.dataset.filter;bs.forEach(x=>x.setAttribute("aria-pressed",String(x===b)));apply()});search.oninput=apply;apply()})()</script></body></html>
