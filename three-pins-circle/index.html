<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三釘繞線畫圓 — Yuuta's Tools</title><link rel="stylesheet" href="../assets/style.css"><script src="../assets/theme.js"></script><style>main{padding-top:32px}p{color:var(--ink-soft)}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:15px 0}.controls button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}canvas{display:block;width:100%;height:580px;background:#f5ead5;border-radius:12px;touch-action:none;cursor:crosshair}.stats{font-size:14px;color:var(--ink-soft)}@media(max-width:600px){canvas{height:430px}}</style></head><body><header class="site-bar"><div class="wrap"><a class="home" href="../">← Yuuta's Tools</a><button class="theme-btn">切換主題</button></div></header><main class="wrap"><h1>三釘繞線畫圓</h1><p>先在畫布上點三下釘下 A、B、C，再親手拖曳筆尖，沿著繃緊的繩子畫線。沒有自動畫線！</p><div class="controls"><label>額外線長 <input id="length" type="range" min="30" max="900" value="340" step="5"> <output id="len">340</output> px</label><button id="reset">重新釘釘子</button><button id="clear">清除筆跡</button><label><input type="checkbox" id="guide"> 顯示完整曲線預覽</label></div><div class="controls"><button id="minus">− 縮小</button><span id="zoomText">100%</span><button id="plus">＋ 放大</button><button id="fit">適合畫面</button><button id="view">重設視角</button></div><canvas id="board"></canvas><p class="stats" id="status">請點擊畫布放置釘子 A（0/3）</p><p class="stats">滑鼠滾輪縮放、空白鍵或右鍵拖曳平移、觸控雙指縮放與移動。這是理想化的無摩擦細繩幾何模擬。</p></main><script>
const $=s=>document.querySelector(s),c=$("#board"),g=c.getContext("2d");let W=800,H=580,dpr=1,z=1,px=0,py=0,pins=[],strokes=[],active=null,angle=-1.5,drag=null,panStart=null;const fingers=new Map();let gesture=null;
const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
function hull(a){if(a.length<3)return a.slice();const p=[...a].sort((x,y)=>x.x-y.x||x.y-y.y),lo=[],hi=[];for(const v of p){while(lo.length>1&&cross(lo.at(-2),lo.at(-1),v)<=0)lo.pop();lo.push(v)}for(const v of [...p].reverse()){while(hi.length>1&&cross(hi.at(-2),hi.at(-1),v)<=0)hi.pop();hi.push(v)}return lo.slice(0,-1).concat(hi.slice(0,-1))}
const per=a=>a.length<2?0:a.reduce((s,p,i)=>s+Math.hypot(p.x-a[(i+1)%a.length].x,p.y-a[(i+1)%a.length].y),0);
const ctr=a=>({x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length});
function curve(t){const o=ctr(pins),dx=Math.cos(t),dy=Math.sin(t),L=per(hull(pins))+(+$("#length").value);let low=0,high=1;const pt=r=>({x:o.x+dx*r,y:o.y+dy*r});while(per(hull([...pins,pt(high)]))<L&&high<1e7)high*=2;for(let i=0;i<32;i++){const mid=(low+high)/2;if(per(hull([...pins,pt(mid)]))<L)low=mid;else high=mid}return pt((low+high)/2)}
function draw(){g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);g.setTransform(dpr*z,0,0,dpr*z,dpr*px,dpr*py);const left=-px/z,top=-py/z,right=(W-px)/z,bottom=(H-py)/z;g.lineWidth=1/z;g.strokeStyle="#dfd2ba";g.beginPath();for(let x=Math.floor(left/25)*25;x<right;x+=25){g.moveTo(x,top);g.lineTo(x,bottom)}for(let y=Math.floor(top/25)*25;y<bottom;y+=25){g.moveTo(left,y);g.lineTo(right,y)}g.stroke();
if(pins.length===3){const pen=curve(angle),rope=hull([...pins,pen]);g.beginPath();rope.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.setLineDash([7/z,5/z]);g.strokeStyle="#587994";g.lineWidth=2/z;g.stroke();g.setLineDash([]);if($("#guide").checked){g.beginPath();for(let i=0;i<=240;i++){const p=curve(i*Math.PI/120);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.closePath();g.strokeStyle="#37a5ac88";g.lineWidth=2/z;g.stroke()}g.strokeStyle="#ef7c37";g.lineWidth=3/z;g.lineCap="round";for(const s of strokes){if(s.length<2)continue;g.beginPath();s.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke()}g.beginPath();g.arc(pen.x,pen.y,9/z,0,Math.PI*2);g.fillStyle="#ee7834";g.fill();g.strokeStyle="#fff";g.lineWidth=2/z;g.stroke()}
pins.forEach((p,i)=>{g.beginPath();g.arc(p.x,p.y,8/z,0,Math.PI*2);g.fillStyle="#223449";g.fill();g.fillStyle="#25374b";g.font=`bold ${15/z}px sans-serif`;g.fillText("ABC"[i],p.x+12/z,p.y-10/z)});$("#status").textContent=pins.length<3?`請點擊畫布放置釘子 ${"ABC"[pins.length]}（${pins.length}/3）`:`三顆釘子已固定 · 繩長 ${(per(hull(pins))+(+$("#length").value)).toFixed(1)} px · 拖曳畫筆開始畫線`;$("#zoomText").textContent=Math.round(z*100)+"%";$("#len").textContent=$("#length").value}
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;dpr=devicePixelRatio||1;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);draw()}addEventListener("resize",resize);
function scr(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function world(p){return{x:(p.x-px)/z,y:(p.y-py)/z}}
function zoom(v,p={x:W/2,y:H/2}){const n=Math.max(.05,Math.min(12,v));px=p.x-(p.x-px)*n/z;py=p.y-(p.y-py)*n/z;z=n;draw()}
function fit(){if(pins.length!==3){z=1;px=py=0;draw();return}const a=Array.from({length:180},(_,i)=>curve(i*Math.PI/90)),xs=a.map(p=>p.x),ys=a.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);z=Math.max(.05,Math.min(12,Math.min(W/(x1-x0+90),H/(y1-y0+90))));px=W/2-(x0+x1)*z/2;py=H/2-(y0+y1)*z/2;draw()}
function addStroke(t){if(!active)return;const prev=active.angle;if(prev==null){active.points.push(curve(t))}else{const delta=Math.atan2(Math.sin(t-prev),Math.cos(t-prev));for(let i=1,n=Math.max(1,Math.ceil(Math.abs(delta)/.025));i<=n;i++)active.points.push(curve(prev+delta*i/n))}angle=t;active.angle=t;draw()}
let space=false;addEventListener("keydown",e=>{if(e.code==="Space"&&!["INPUT","BUTTON"].includes(document.activeElement.tagName)){space=true;e.preventDefault()}});addEventListener("keyup",e=>{if(e.code==="Space")space=false});c.oncontextmenu=e=>e.preventDefault();
c.onpointerdown=e=>{const s=scr(e);fingers.set(e.pointerId,s);c.setPointerCapture(e.pointerId);if(fingers.size===2){drag=null;active=null;const [a,b]=[...fingers.values()];gesture={dist:Math.hypot(a.x-b.x,a.y-b.y),z,px,py,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return}if(space||e.button===2){drag="pan";panStart={s,px,py};return}const p=world(s);if(pins.length<3){pins.push(p);drag="placed";draw();return}drag="pen";active={points:[],angle:null};strokes.push(active.points);const o=ctr(pins);addStroke(Math.atan2(p.y-o.y,p.x-o.x))};
c.onpointermove=e=>{if(!fingers.has(e.pointerId))return;const s=scr(e);fingers.set(e.pointerId,s);if(fingers.size===2&&gesture){const [a,b]=[...fingers.values()],dist=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;z=Math.max(.05,Math.min(12,gesture.z*dist/Math.max(1,gesture.dist)));px=mx-(gesture.mx-gesture.px)*z/gesture.z;py=my-(gesture.my-gesture.py)*z/gesture.z;draw();return}if(drag==="pan"){px=panStart.px+s.x-panStart.s.x;py=panStart.py+s.y-panStart.s.y;draw()}else if(drag==="pen"){const p=world(s),o=ctr(pins);addStroke(Math.atan2(p.y-o.y,p.x-o.x))}};
function end(e){fingers.delete(e.pointerId);drag=null;active=null;gesture=null}c.onpointerup=end;c.onpointercancel=end;
c.addEventListener("wheel",e=>{e.preventDefault();zoom(z*(e.deltaY<0?1.12:1/1.12),scr(e))},{passive:false});
$("#plus").onclick=()=>zoom(z*1.25);$("#minus").onclick=()=>zoom(z/1.25);$("#fit").onclick=fit;$("#view").onclick=()=>{z=1;px=py=0;draw()};$("#reset").onclick=()=>{pins=[];strokes=[];angle=-1.5;draw()};$("#clear").onclick=()=>{strokes=[];draw()};$("#length").oninput=()=>{strokes=[];draw()};$("#guide").onchange=draw;resize();
</script></body></html>
