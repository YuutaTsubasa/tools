<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙機車路徑實驗 — Yuuta's Tools</title><link rel="stylesheet" href="../assets/style.css"><script src="../assets/theme.js"></script><style>main{padding-top:34px}.lead{color:var(--ink-soft);font-size:18px}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:18px 0}.controls button{font:inherit;font-size:15px;padding:8px 15px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}.controls button.primary{background:var(--wire);color:#fff;border-color:var(--wire)}button:disabled{opacity:.45;cursor:not-allowed}.stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fffdf7}canvas{display:block;width:100%;height:min(66vh,620px);min-height:380px;touch-action:none;cursor:crosshair}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}.stat strong{display:block}.stat span{font-family:var(--font-code);font-size:14px;color:var(--ink-soft)}.hint{color:var(--ink-soft);font-size:14px}.yellow{color:#ba8200}.blue{color:#147dc2}@media(max-width:600px){canvas{height:490px}.stats{grid-template-columns:1fr}}</style></head><body><header class="site-bar"><div class="wrap"><a class="home" href="../">← Yuuta's Tools</a><button class="theme-btn">切換主題</button></div></header><main class="wrap"><h1>雙機車路徑實驗</h1><p class="lead">自由畫出黃色、藍色機車的行駛路線。兩台機車會同時出發；如果途中相撞，就會停下並在碰撞處顯示紅色叉叉！0w0</p><div class="controls"><button id="yellow" class="primary">🟡 畫黃色路線</button><button id="blue">🔵 畫藍色路線</button><button id="undo">清除目前路線</button><button id="play" disabled>▶ 同時出發</button><button id="reset">全部重來</button><label>行駛時間 <input id="duration" type="range" min="2" max="20" step="1" value="6"> <output id="seconds">6</output> 秒</label></div><div class="stage"><canvas id="board" aria-label="繪製兩台機車路線的畫布"></canvas></div><p id="status" class="hint" role="status">請從左下角黃色機車開始畫線，拖曳至右上角黃色商店。</p><div class="stats"><div class="stat"><strong class="yellow">🟡 黃色機車</strong><span id="yellowStats">尚未畫路線</span></div><div class="stat"><strong class="blue">🔵 藍色機車</strong><span id="blueStats">尚未畫路線</span></div></div><p class="hint">提示：路線可以交叉、繞圈或折返。機車沿路徑以等速前進，但兩台機車的速度會依各自路線長度調整，確保同時抵達。畫錯可重新選擇顏色再畫。</p></main><script>
(()=>{"use strict";
const $=s=>document.querySelector(s),canvas=$("#board"),ctx=canvas.getContext("2d");
const config={yellow:{start:{x:.12,y:.83},end:{x:.86,y:.16},color:"#e4ad20",dark:"#8b6500",name:"黃色"},blue:{start:{x:.12,y:.16},end:{x:.86,y:.83},color:"#168bd2",dark:"#075d9a",name:"藍色"}};
let collision=null;let selected="yellow",paths={yellow:[],blue:[]},drawing=false,playing=false,progress=0,started=0,raf=0,dimensions={w:800,h:520},pointerId=null;
const pos=(p)=>({x:p.x*dimensions.w,y:p.y*dimensions.h});
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lengths=pts=>pts.slice(1).reduce((n,p,i)=>n+distance(p,pts[i]),0);
function sample(points,f){if(!points.length)return null;if(points.length===1)return points[0];const total=lengths(points),target=total*f;let d=0;for(let i=1;i<points.length;i++){const step=distance(points[i-1],points[i]);if(d+step>=target){const t=step?Math.min(1,(target-d)/step):0;return{x:points[i-1].x+(points[i].x-points[i-1].x)*t,y:points[i-1].y+(points[i].y-points[i-1].y)*t}}d+=step}return points.at(-1)}
function pathToPixels(name){return paths[name].map(pos)}
function label(text,x,y,color){ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillStyle=color;ctx.fillText(text,x,y)}
function endpoint(p,emoji,name){const q=pos(p);ctx.fillStyle="#fff";ctx.strokeStyle="#d5dce6";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(q.x-27,q.y-26,54,53,11);ctx.fill();ctx.stroke();ctx.font="29px sans-serif";ctx.textAlign="center";ctx.fillText(emoji,q.x,q.y+8);label(name,q.x,q.y+43,"#475569")}
function bike(p,color,angle){if(!p)return;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(angle);ctx.fillStyle=color;ctx.strokeStyle="#223449";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-20,-11,40,22,7);ctx.fill();ctx.stroke();ctx.fillStyle="#223449";for(const x of [-12,12]){ctx.beginPath();ctx.arc(x,12,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(6,-3,4,0,Math.PI*2);ctx.fill();ctx.restore()}
function collisionAt(a,b){const A=sample(pathToPixels("yellow"),a),B=sample(pathToPixels("blue"),a),C=sample(pathToPixels("yellow"),b),D=sample(pathToPixels("blue"),b);if(!A||!B||!C||!D)return null;const rx=A.x-B.x,ry=A.y-B.y,vx=(C.x-D.x)-rx,vy=(C.y-D.y)-ry;const t=Math.max(0,Math.min(1,-(rx*vx+ry*vy)/(vx*vx+vy*vy||1)));const sep=Math.hypot(rx+vx*t,ry+vy*t);if(sep>25)return null;const f=a+(b-a)*t,p=sample(pathToPixels("yellow"),f),q=sample(pathToPixels("blue"),f);return {f,x:(p.x+q.x)/2,y:(p.y+q.y)/2}}
function draw(){const {w,h}=dimensions;ctx.clearRect(0,0,w,h);ctx.fillStyle="#fffdf7";ctx.fillRect(0,0,w,h);ctx.strokeStyle="#eee8d9";ctx.lineWidth=1;for(let x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
for(const name of ["yellow","blue"]){const c=config[name],points=pathToPixels(name);if(points.length>1){ctx.strokeStyle=c.color;ctx.lineWidth=7;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}}
endpoint(config.yellow.end,"🏠","黃色商店");endpoint(config.blue.end,"🏠","藍色商店");
for(const name of ["yellow","blue"]){const c=config[name],points=pathToPixels(name),p=playing||progress>0?sample(points,progress):pos(c.start);const next=playing||progress>0?sample(points,Math.min(1,progress+.003)):points[1]||pos(c.end);bike(p,c.color,next?Math.atan2(next.y-p.y,next.x-p.x):0)}
if(collision){const {x,y}=collision;ctx.save();ctx.translate(x,y);ctx.strokeStyle="#e32636";ctx.lineWidth=12;ctx.lineCap="round";ctx.shadowColor="#ff384b";ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(-26,-26);ctx.lineTo(26,26);ctx.moveTo(26,-26);ctx.lineTo(-26,26);ctx.stroke();ctx.restore();label("碰撞！",x,y-43,"#d51f2d")}
for(const name of ["yellow","blue"]){const c=config[name],p=pos(c.start);label(c.name+"起點",p.x,p.y-30,c.dark)}
}
function update(){for(const name of ["yellow","blue"]){const p=pathToPixels(name),l=lengths(p),sec=+$("#duration").value;$("#"+name+"Stats").textContent=p.length>1?`路線長度 ${Math.round(l)} px · 速度 ${(l/sec).toFixed(1)} px/s`:"尚未畫路線"}$("#play").disabled=playing||!["yellow","blue"].every(n=>paths[n].length>1);$("#seconds").textContent=$("#duration").value;$("#yellow").classList.toggle("primary",selected==="yellow");$("#blue").classList.toggle("primary",selected==="blue")}
function select(name){if(playing)return;selected=name;update();$("#status").textContent=`請從${config[name].name}機車拖曳到對應商店。可以自由繞路。`}
function resetPlayback(){cancelAnimationFrame(raf);playing=false;progress=0;collision=null}
function finishPath(){if(!drawing)return;drawing=false;pointerId=null;const name=selected,points=paths[name],end=config[name].end;if(points.length<2){paths[name]=[];$("#status").textContent="路線太短，請再試一次。";update();draw();return}const last=points.at(-1);if(distance(pos(last),pos(end))>Math.max(42,dimensions.w*.06)){paths[name]=[];$("#status").textContent="還沒到商店！請把路線畫到對應的商店附近再放開。";update();draw();return}points.push({...end});if(name==="yellow"&&!paths.blue.length)select("blue");else if(name==="blue"&&!paths.yellow.length)select("yellow");$("#status").textContent=["yellow","blue"].every(n=>paths[n].length>1)?"兩條路線都完成！按「同時出發」觀看。":"路線完成！接著畫另一台機車的路線。";update();draw()}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
canvas.addEventListener("pointerdown",e=>{if(playing)return;const p=point(e),start=config[selected].start;if(distance(pos(p),pos(start))>Math.max(55,dimensions.w*.08)){ $("#status").textContent="請從目前選擇的機車起點開始畫線。";return}resetPlayback();paths[selected]=[{...start}];drawing=true;pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);update();draw()});
canvas.addEventListener("pointermove",e=>{if(!drawing||e.pointerId!==pointerId)return;const p=point(e);p.x=Math.max(0,Math.min(1,p.x));p.y=Math.max(0,Math.min(1,p.y));const pts=paths[selected];if(distance(pos(pts.at(-1)),pos(p))>2){pts.push(p);draw()}});
canvas.addEventListener("pointerup",e=>{if(e.pointerId===pointerId)finishPath()});canvas.addEventListener("pointercancel",e=>{if(e.pointerId===pointerId)finishPath()});
$("#yellow").onclick=()=>select("yellow");$("#blue").onclick=()=>select("blue");$("#undo").onclick=()=>{resetPlayback();paths[selected]=[];update();draw();$("#status").textContent="已清除目前路線，請重新畫。"};$("#reset").onclick=()=>{resetPlayback();paths={yellow:[],blue:[]};selected="yellow";update();draw();$("#status").textContent="已重設，從黃色機車開始畫線。"};$("#duration").oninput=()=>{if(playing)resetPlayback();update();draw()};
$("#play").onclick=()=>{if(playing||!["yellow","blue"].every(n=>paths[n].length>1))return;resetPlayback();playing=true;started=performance.now();const duration=+$("#duration").value*1000;$("#status").textContent="兩台機車同時出發！";update();function frame(now){const next=Math.min(1,(now-started)/duration);const hit=collisionAt(progress,next);progress=hit?hit.f:next;if(hit){collision=hit;playing=false;draw();$("#status").textContent="💥 兩台機車撞到了！紅色叉叉標示碰撞位置。可以重播或修改路線。";update();return}draw();if(progress<1)raf=requestAnimationFrame(frame);else{playing=false;$("#status").textContent="兩台機車同時抵達！可以重播，或重畫路線。";update()}}raf=requestAnimationFrame(frame)};
function resize(){const r=canvas.getBoundingClientRect();dimensions={w:r.width,h:r.height};const dpr=window.devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}window.addEventListener("resize",resize);update();resize();
})();
</script></body></html>
